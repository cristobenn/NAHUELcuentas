  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an

n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: clamp(18px, 3vw, 24px); font-weight: 800; letter-spacing: -0.02em; display: block; margin-top: 2px;\">{{ pendingLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; right: 16px; bottom: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(0,0,0,0.3); letter-spacing: 0.25em; pointer-events: none;\">.. : : {{ yearLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <footer style=\"position: fixed; bottom: 18px; left: 0; right: 0; padding: 0 20px; pointer-events: none; z-index: 50;\">\n    <div style=\"max-width: 420px; margin: 0 auto; background: rgba(22,22,26,0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); border-radius: 999px; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 15px 40px rgba(0,0,0,0.8);\">\n      <div style=\"display: flex; align-items: center; gap: 8px;\">\n        <div style=\"position: relative; width: 10px; height: 10px; display: flex; align-items: center; justify-content: center;\">\n          <span style=\"position: absolute; inset: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: omPulse 2s ease-in-out infinite;\"><\u002Fspan>\n          <span style=\"position: relative; width: 8px; height: 8px; border-radius: 999px; background: var(--accent);\"><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.8); text-transform: uppercase; font-weight: 700; letter-spacing: 0.15em;\">Control :: Online<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em;\">{{ statusLabel }} listas<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <sc-if value=\"{{ confirmReset }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px;\" sc-camel-on-click=\"{{ cancelReset }}\">\n      <div style=\"width: 100%; max-width: 400px; background: #16161A; border: 1px solid var(--accent-40); border-radius: 24px; padding: 26px; box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 0 40px var(--accent-12);\" sc-camel-on-click=\"{{ stop }}\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); display: block;\">:: Nuevo mes<\u002Fspan>\n        <h3 style=\"margin: 8px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em;\">¿Reiniciar todas las cuentas?<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.65);\">Todas volverán a <strong style=\"color: #F87171; font-weight: 700;\">pendientes<\u002Fstrong>. Los nombres, montos y CBU no se borran.<\u002Fp>\n        <div style=\"display: flex; gap: 10px; margin-top: 22px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ cancelReset }}\" style=\"flex: 1; padding: 13px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: color 0.2s, background 0.2s;\" style-hover=\"color: #FFFFFF; background: rgba(255,255,255,0.1);\" style-active=\"transform: scale(0.97);\">Cancelar<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ resetFromBanner }}\" style=\"flex: 1.3; padding: 13px 16px; bo rray(saved)) bills = saved;\n      }\n    } catch (e) { console.error('Error al cargar cuentas guardadas:', e); }\n    this.state = {\n      bills: bills,\n      isAdding: false, newName: '', newAmount: '', newAccount: '', showNewAccount: false,\n      editingId: null, editName: '', editAmount: '', editAccount: '', showEditAccount: false,\n      deletingId: null, copiedId: null, confirmReset: false, monthBanner: false, isScrolled: false,\n      swipeId: null, swipeX: 0, swiping: false\n    };\n    this._drag = null;\n    this._noClickUntil = 0;\n  }\n  componentDidMount() {\n    this.applyAccent();\n    this._onScroll = () => {\n      const sc = window.scrollY > 25;\n      if (sc !== this.state.isScrolled) this.setState({ isScrolled: sc });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._noZoom = (e) => { e.preventDefault(); };\n    ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, this._noZoom, { passive: false }));\n    this._noPinch = (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); };\n    document.addEventListener('touchmove', this._noPinch, { passive: false });\n    this._noWheelZoom = (e) => { if (e.ctrlKey) e.preventDefault(); };\n    document.addEventListener('wheel', this._noWheelZoom, { passive: false });\n    const period = this.period();\n    const stored = localStorage.getItem('monthly_bills_period');\n    if (!stored) { localStorage.setItem('monthly_bills_period', period); return; }\n    if (stored !== period) {\n      if (this.state.bills.some(b => b.paid)) this.setState({ monthBanner: true });\n      else localStorage.setItem('monthly_bills_period', period);\n    }\n  }\n  componentDidUpdate(prevProps) {\n    if (prevProps && prevProps.accent !== this.props.accent) this.applyAccent();\n  }\n  saveBills(bills, extra) {\n    this.setState(Object.assign({ bills: bills }, extra || {}));\n    try { localStorage.setItem('monthly_bills', JSON.stringify( te({\n      editingId: id, editName: b.name,\n      editAmount: b.amount !== undefined ? String(b.amount) : '',\n      editAccount: b.accountNumber || '', showEditAccount: Boolean(b.accountNumber),\n      deletingId: null, isAdding: false, swipeId: null, swipeX: 0, swiping: false\n    });\n  }\n  saveEdit(e) {\n    e.preventDefault(); e.stopPropagation();\n    const s = this.state;\n    if (!s.editName.trim()) return;\n    this.saveBills(\n      s.bills.map(b => b.id === s.editingId ? { ...b, name: s.editName.trim(), amount: this.parseAmount(s.editAmount), accountNumber: s.editAccount.trim() || undefined } : b),\n      { editingId: null }\n    );\n    this.vibrate(15);\n  }\n  addBill(e) {\n    e.preventDefault();\n    const s = this.state;\n    if (!s.newName.trim()) return;\n    const bill = { id: this.uid(), name: s.newName.trim(), paid: false, amount: this.parseAmount(s.newAmount), accountNumber: s.newAccount.trim() || undefined };\n    this.saveBills([...s.bills, bill], { newName: '', newAmount: '', newAccount: '', showNewAccount: false, isAdding: false });\n    this.vibrate(15);\n  }\n  removeBill(id) {\n    this.saveBills(this.state.bills.filter(b => b.id !== id), { deletingId: null });\n    this.vibrate([20, 30]);\n  }\n  askReset() {\n    this.vibrate(15);\n    this.setState({ confirmReset: true, isAdding: false, editingId: null, deletingId: null });\n  }\n  doReset() {\n    clearTimeout(this._rt);\n    localStorage.setItem('monthly_bills_period', this.period());\n    this.saveBills(this.state.bills.map(b => ({ ...b, paid: false })), { confirmReset: false, monthBanner: false });\n    this.vibrate([20, 30, 20]);\n  }\n  keepMonth() {\n    localStorage.setItem('monthly_bills_period', this.period());\n    this.setState({ monthBanner: false });\n  }\n  copyAccount(id, text, e) {\n    e.stopPropagation();\n    const t = String(text).trim();\n    const done = () => {\n      this.vibrate(15);\n      this.setState({ copiedId: id });\n      clearTimeout(this._ct);\n
